<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CompareGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --forest-900:#14251E;
  --forest-700:#1F3D30;
  --paper:#F6F1E4;
  --gold:#E8A93C;
  --tomato:#C1432B;
  --ink:#1C1B17;
  --ink-soft:#5B5647;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--forest-900);
  color:var(--paper);
  font-family:'IBM Plex Sans', sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px; margin:0 auto; padding:0 20px;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

header.site{
  background:var(--forest-700);
  border-bottom:1px solid rgba(246,241,228,0.12);
  position:sticky; top:0; z-index:20;
}
header.site .wrap{display:flex; align-items:center; gap:12px; padding-top:14px; padding-bottom:14px;}
.wordmark{font-family:'IBM Plex Mono', monospace; font-weight:700; letter-spacing:0.04em; font-size:1.05rem; color:var(--paper); flex:0 0 auto;}
.wordmark span{color:var(--gold);}
.tagline-mini{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:rgba(246,241,228,0.65); letter-spacing:.03em; flex:1 1 auto;}
.lang-toggle{display:flex; flex:0 0 auto; border:1px solid rgba(246,241,228,0.3); border-radius:5px; overflow:hidden;}
.lang-toggle button{
  background:transparent; border:none; color:rgba(246,241,228,0.7);
  font-family:'IBM Plex Mono', monospace; font-size:0.74rem; font-weight:600;
  padding:6px 11px; letter-spacing:.04em;
}
.lang-toggle button[aria-pressed="true"]{background:var(--gold); color:var(--ink);}
.lang-toggle button:not([aria-pressed="true"]):hover{color:var(--gold);}

.hero{padding:40px 0 24px;}
.eyebrow{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.12em; color:var(--gold); text-transform:uppercase; margin-bottom:14px;}
h1.headline{
  font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase;
  font-size:clamp(2.1rem, 7vw, 3.4rem); line-height:0.98; margin:0 0 14px;
  letter-spacing:0.01em; color:var(--paper);
}
h1.headline em{color:var(--gold); font-style:normal;}
.subhead{font-size:1rem; color:rgba(246,241,228,0.82); max-width:50ch; margin:0 0 22px;}

.controls{display:flex; gap:10px; flex-wrap:wrap;}
.search-box{
  flex:1 1 240px; display:flex; align-items:center; gap:10px;
  background:var(--paper); color:var(--ink);
  border-radius:6px; padding:0 16px; height:60px;
  border:2px solid transparent; box-shadow:0 10px 26px rgba(0,0,0,0.3);
  transition:border-color .15s ease;
}
.search-box:focus-within{border-color:var(--gold);}
.search-box .search-icon{font-size:1.1rem; flex:0 0 auto; opacity:.75;}
.search-box input{
  border:none; background:transparent; outline:none;
  font-family:'IBM Plex Mono', monospace; font-size:1.02rem; color:var(--ink);
  width:100%; height:100%;
}
.clear-search{
  flex:0 0 auto; background:rgba(28,27,23,0.1); border:none; color:var(--ink-soft);
  width:26px; height:26px; border-radius:50%; font-size:0.95rem; line-height:1;
  display:none; align-items:center; justify-content:center; padding:0;
}
.clear-search.show{display:flex;}
.clear-search:hover{background:rgba(28,27,23,0.2); color:var(--ink);}
.search-btn{
  flex:0 0 auto; background:var(--gold); color:var(--ink); border:none;
  border-radius:6px; padding:0 24px; height:60px; font-weight:700; font-size:0.95rem;
  box-shadow:0 10px 26px rgba(0,0,0,0.3); transition:filter .15s ease, transform .15s ease;
}
.search-btn:hover{filter:brightness(1.06); transform:translateY(-1px);}

.pills{display:flex; gap:8px; overflow-x:auto; padding:20px 0 6px;}
.pill{
  flex:0 0 auto; background:transparent; color:rgba(246,241,228,0.75);
  border:1px solid rgba(246,241,228,0.3); border-radius:999px;
  padding:7px 16px; font-size:0.82rem; transition:all .15s ease;
}
.pill.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:600;}
.pill:hover:not(.active){border-color:var(--gold); color:var(--gold);}

.geo-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:rgba(246,241,228,0.06); border:1px solid rgba(246,241,228,0.16);
  border-radius:8px; padding:12px 14px; margin-top:14px;
}
.geo-btn{
  background:var(--gold); color:var(--ink); border:none; border-radius:6px;
  padding:9px 16px; font-weight:700; font-size:0.85rem; flex:0 0 auto;
}
.geo-btn:hover{filter:brightness(1.08);}
.geo-msg{font-size:0.84rem; color:rgba(246,241,228,0.72); flex:1 1 180px; min-width:0; margin:0;}
.geo-msg strong{color:var(--gold); font-weight:600;}
.city-picker{display:flex; gap:7px; flex-wrap:wrap; width:100%; margin-top:4px;}
.city-btn{
  background:transparent; border:1px solid rgba(246,241,228,0.3); color:rgba(246,241,228,0.85);
  border-radius:999px; padding:5px 13px; font-size:0.78rem;
}
.city-btn:hover{border-color:var(--gold); color:var(--gold);}
.radius-toggle{
  display:flex; align-items:center; gap:8px; width:100%;
  font-size:0.84rem; color:rgba(246,241,228,0.8); cursor:pointer;
  padding-top:8px; border-top:1px dashed rgba(246,241,228,0.16); margin-top:4px;
}
.radius-toggle input{accent-color:var(--gold); width:16px; height:16px; cursor:pointer; flex:0 0 auto;}

.updated-line{
  display:flex; align-items:center; gap:7px; margin-top:12px;
  font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:rgba(246,241,228,0.5);
}
.updated-dot{width:6px; height:6px; border-radius:50%; background:var(--gold); flex:0 0 auto;}

.results-section{padding:14px 0 8px;}
.results-placeholder{
  border:1px dashed rgba(246,241,228,0.3); border-radius:8px;
  padding:28px 20px; text-align:center; color:rgba(246,241,228,0.6); font-size:0.92rem;
}
.results-card{
  background:var(--paper); color:var(--ink); border-radius:8px;
  padding:26px 22px 20px; position:relative;
  box-shadow:0 16px 34px rgba(0,0,0,0.35); animation:riseIn .35s ease;
}
@keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.results-card::before, .results-card::after{
  content:""; position:absolute; left:10px; right:10px; height:10px;
  background:radial-gradient(circle at 6px 5px, var(--forest-900) 5px, transparent 5.6px);
  background-size:14px 10px; background-repeat:repeat-x;
}
.results-card::before{top:-6px;}
.results-card::after{bottom:-6px;}
.results-meta{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;}
.results-title{font-size:1.3rem; font-weight:700; margin:2px 0 12px;}

.coupon-banner{
  display:flex; align-items:center; gap:10px;
  border:2px dashed var(--tomato); border-radius:6px;
  padding:10px 12px; margin:0 0 16px; background:rgba(193,67,43,0.06);
}
.coupon-banner .tag-icon{font-size:1.1rem; flex:0 0 auto;}
.coupon-banner p{margin:0; font-size:0.84rem; color:var(--ink);}
.coupon-banner strong{color:var(--tomato);}

.savings{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  background:var(--forest-900); border-radius:6px; padding:14px 16px; margin:0 0 16px;
}
.savings-amount{font-family:'Anton', sans-serif; font-size:1.9rem; line-height:0.9; color:var(--gold); flex:0 0 auto;}
.savings-label{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:.09em; text-transform:uppercase; color:rgba(246,241,228,0.72); flex:1 1 auto;}
.savings-vs{font-size:0.78rem; color:rgba(246,241,228,0.6); flex:1 1 100%; margin:0;}
.savings.flat{padding:11px 16px;}
.savings.flat .savings-label{font-size:0.72rem; text-transform:none; letter-spacing:0;}

.store-row{display:flex; align-items:flex-start; gap:10px; padding:12px 2px; border-bottom:1px dashed rgba(28,27,23,0.15); position:relative;}
.store-row:last-child{border-bottom:none;}
.store-row.best{background:rgba(232,169,60,0.16); margin:0 -10px; padding-left:12px; padding-right:12px; border-radius:4px;}
.store-row.out-of-range{opacity:0.5;}
.store-rank{font-family:'IBM Plex Mono', monospace; font-size:0.85rem; color:var(--ink-soft); width:1.6em; flex:0 0 auto; padding-top:2px;}
.store-main{flex:1; min-width:0;}
.store-name{font-weight:600;}
.member-note{font-size:0.7rem; color:var(--ink-soft); font-style:italic; margin-left:6px;}
.store-dist{font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--ink-soft); display:block; margin-top:1px;}
.store-unit{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--ink-soft); display:block; margin-top:2px;}
.price-block{flex:0 0 auto; text-align:right;}
.price-was{display:block; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--ink-soft); text-decoration:line-through;}
.store-price{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:1.05rem;}
.store-row.unavailable .store-price{color:var(--ink-soft); font-style:italic; font-weight:400; font-size:0.9rem;}
.promo-tag{
  display:inline-block; margin-top:2px; background:var(--tomato); color:var(--paper);
  font-family:'IBM Plex Mono', monospace; font-size:0.6rem; font-weight:700;
  letter-spacing:.05em; padding:2px 6px; border-radius:3px;
}
.out-header{
  font-family:'IBM Plex Mono', monospace; font-size:0.66rem; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); padding:14px 0 2px;
  border-top:1px solid rgba(28,27,23,0.15); margin-top:8px;
}
.range-note{
  border:1px dashed rgba(28,27,23,0.25); border-radius:6px;
  padding:16px; text-align:center; color:var(--ink-soft); font-size:0.88rem;
}
.best-badge{
  position:absolute; top:-12px; right:10px; background:var(--gold); color:var(--ink);
  font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.64rem;
  letter-spacing:0.05em; padding:4px 9px; border:2px dashed var(--ink);
  border-radius:3px; transform:rotate(-6deg); box-shadow:2px 2px 0 rgba(0,0,0,0.15);
}

.card-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap;}
.share-btn, .route-btn{
  background:transparent; border:1px solid rgba(28,27,23,0.28); color:var(--ink);
  border-radius:6px; padding:9px 15px; font-size:0.82rem; font-weight:600;
  display:inline-flex; align-items:center; gap:7px;
}
.share-btn:hover, .route-btn:hover{border-color:var(--ink); background:rgba(28,27,23,0.05);}
.route-btn{border-color:var(--tomato); color:var(--tomato);}
.route-btn:hover{background:rgba(193,67,43,0.06);}
.share-fallback{margin-top:12px;}
.share-fallback textarea{
  width:100%; min-height:70px; resize:vertical;
  font-family:'IBM Plex Mono', monospace; font-size:0.76rem; line-height:1.5;
  color:var(--ink); background:#FFFDF7;
  border:1px solid rgba(28,27,23,0.25); border-radius:5px; padding:9px;
}

.loading-head{display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono', monospace; font-size:0.82rem; color:var(--ink-soft); margin-bottom:18px;}
.loading-dot{width:9px; height:9px; border-radius:50%; background:var(--gold); flex:0 0 auto; animation:beat 0.9s ease-in-out infinite;}
@keyframes beat{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.5); opacity:.45;}}
.skel{height:15px; border-radius:4px; background:rgba(28,27,23,0.11); margin:14px 0; animation:fade 1.1s ease-in-out infinite;}
.skel.w80{width:80%;} .skel.w60{width:60%;} .skel.w70{width:70%;} .skel.w45{width:45%;}
@keyframes fade{0%,100%{opacity:1;} 50%{opacity:.45;}}

.route-section{padding:22px 0 4px;}
.route-card{background:var(--paper); color:var(--ink); border-radius:8px; padding:18px; box-shadow:0 14px 30px rgba(0,0,0,0.32);}
.route-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
.route-head h3{font-size:1.02rem; margin:0;}
.route-close{background:transparent; border:none; color:var(--ink-soft); font-size:1.1rem; padding:2px 6px;}
.route-close:hover{color:var(--ink);}
.route-canvas{width:100%; height:220px; border-radius:6px; background:#e4e1d8;}
.route-meta{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap;}
.route-dist{font-family:'IBM Plex Mono', monospace; font-weight:700;}
.route-maps-link{
  background:var(--tomato); color:var(--paper); border-radius:6px; padding:10px 16px;
  font-size:0.85rem; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:7px;
}
.route-maps-link:hover{filter:brightness(1.08);}
.route-attrib{font-size:0.65rem; color:var(--ink-soft); margin-top:8px;}

.nearby-section{padding:22px 0 4px;}
.nearby-list{background:var(--paper); color:var(--ink); border-radius:8px; padding:16px 18px; box-shadow:0 10px 22px rgba(0,0,0,0.28);}
.nearby-row{display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px dashed rgba(28,27,23,0.15);}
.nearby-row:last-child{border-bottom:none;}
.nearby-banner{font-weight:700; flex:0 0 auto;}
.nearby-place{flex:1; font-size:0.84rem; color:var(--ink-soft); min-width:0;}
.nearby-km{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.9rem; flex:0 0 auto;}
.nearby-row.absent .nearby-banner{color:var(--ink-soft); font-weight:600;}
.nearby-row.absent .nearby-km{font-family:'IBM Plex Sans', sans-serif; font-weight:400; font-size:0.78rem; color:var(--ink-soft); font-style:italic;}

.demo-section{padding:26px 0 10px;}
.section-label{font-family:'IBM Plex Mono', monospace; font-size:0.75rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(246,241,228,0.55); margin-bottom:4px;}
.section-title{font-weight:700; font-size:1.05rem; margin:0 0 4px; color:var(--paper);}
.section-hint{font-size:0.85rem; color:rgba(246,241,228,0.6); margin:0 0 18px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px;}
.card{
  position:relative; background:var(--paper); color:var(--ink); border-radius:8px;
  padding:14px 12px; text-align:center; border:none;
  transition:transform .15s ease, box-shadow .15s ease; box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
.card:hover{transform:translateY(-3px); box-shadow:0 10px 20px rgba(0,0,0,0.28);}
.card.picked{outline:2px solid var(--gold); outline-offset:-2px; box-shadow:0 8px 18px rgba(232,169,60,0.3);}
.card .tick{
  position:absolute; top:7px; right:7px; width:20px; height:20px; border-radius:50%;
  background:var(--gold); color:var(--ink); font-size:0.72rem; font-weight:700;
  line-height:20px; text-align:center; display:none;
}
.card.picked .tick{display:block;}
.card .cat-tag{font-family:'IBM Plex Mono', monospace; font-size:0.62rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
.card .pname{font-weight:600; font-size:0.88rem; margin:4px 0 2px; line-height:1.25;}
.card .pbrand{font-size:0.74rem; color:var(--ink-soft);}
.card .pprice{font-family:'IBM Plex Mono', monospace; font-size:0.8rem; margin-top:6px; color:var(--ink);}
.empty-msg{color:rgba(246,241,228,0.6); font-size:0.88rem;}

.history-section{padding:22px 0 10px;}
.history-chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  background:transparent; border:1px solid rgba(246,241,228,0.3); color:rgba(246,241,228,0.85);
  border-radius:999px; padding:6px 14px; font-size:0.8rem;
}
.chip:hover{border-color:var(--gold); color:var(--gold);}

body.has-basket{padding-bottom:96px;}
.basket-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--forest-700); border-top:2px solid var(--gold);
  box-shadow:0 -8px 26px rgba(0,0,0,0.45); transform:translateY(110%); transition:transform .22s ease;
}
.basket-bar.open{transform:translateY(0);}
.basket-bar .wrap{display:flex; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px;}
.basket-info{flex:1; min-width:0;}
.basket-count{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:.09em; text-transform:uppercase; color:rgba(246,241,228,0.65); display:block;}
.basket-best{font-size:0.95rem; font-weight:600; color:var(--paper); display:block; margin-top:2px;}
.basket-best strong{color:var(--gold);}
.basket-actions{display:flex; gap:8px; flex:0 0 auto;}
.basket-view{background:var(--gold); color:var(--ink); border:none; border-radius:6px; padding:10px 16px; font-weight:700; font-size:0.85rem;}
.basket-view:hover{filter:brightness(1.08);}
.basket-clear{background:transparent; color:rgba(246,241,228,0.8); border:1px solid rgba(246,241,228,0.3); border-radius:6px; padding:10px 13px; font-size:0.82rem;}
.basket-clear:hover{border-color:var(--tomato); color:var(--tomato);}

.basket-row{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px dashed rgba(28,27,23,0.15); position:relative;}
.basket-row:last-child{border-bottom:none;}
.basket-row.best{background:rgba(232,169,60,0.16); margin:0 -10px; padding-left:12px; padding-right:12px; border-radius:4px;}
.basket-row.partial{opacity:0.62;}
.basket-store{flex:1; min-width:0;}
.basket-store .n{font-weight:600; display:block;}
.basket-store .cov{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--ink-soft); display:block; margin-top:1px;}
.basket-total{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:1.05rem; flex:0 0 auto;}
.items-head{
  font-family:'IBM Plex Mono', monospace; font-size:0.66rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); padding:16px 0 4px; border-top:1px solid rgba(28,27,23,0.15); margin-top:12px;
}
.item-line{display:flex; align-items:baseline; gap:8px; padding:7px 0; font-size:0.86rem;}
.item-name{flex:1; min-width:0;}
.item-price{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.86rem; flex:0 0 auto;}

footer{padding:30px 0 44px; border-top:1px solid rgba(246,241,228,0.12); margin-top:26px;}
.footer-disclaimer{
  font-size:0.86rem; font-weight:600; color:var(--paper); line-height:1.5; max-width:64ch; margin:0 0 12px;
  padding:12px 14px; border:1px dashed rgba(246,241,228,0.35); border-radius:6px;
}
footer p.footer-note{font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:rgba(246,241,228,0.5); line-height:1.6; max-width:64ch; margin:0 0 8px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}
@media (max-width:560px){ .tagline-mini{display:none;} }
@media (max-width:480px){
  .controls{flex-direction:column;}
  .search-box, .search-btn{width:100%;}
}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <div class="wordmark">COMPARE<span>GO</span></div>
    <div class="tagline-mini" data-i18n="tagline"></div>
    <div class="lang-toggle" role="group" data-i18n-aria-label="langGroup">
      <button type="button" id="langFr" data-lang="fr" aria-pressed="true" lang="fr">FR</button>
      <button type="button" id="langEn" data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 class="headline" data-i18n-html="headline"></h1>
    <p class="subhead" data-i18n="subhead"></p>
    <form class="controls" id="searchForm">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">🔎</span>
        <input id="searchInput" type="text" autocomplete="off"
               data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchLabel">
        <button type="button" class="clear-search" id="clearSearch" data-i18n-aria-label="clearSearch">×</button>
      </div>

    var shelf = onPromo ? sp.promo : sp.regular;
    var packMult = (store === "Costco") ? (sp.packMult || 1) : 1;
    var unit = formatUnitPrice(shelf, product.size, packMult);
    var effective = product.coupon ? Math.max(0.01, shelf - product.coupon) : shelf;
    return {
      available:true, regular:sp.regular, onPromo:onPromo, shelf:shelf,
      unit:unit, effective:effective
    };
  }

  /* ---------- État ---------- */

  var state = {
    query:"", category:"all", basket:[],
    pos:null, posCityIndex:null, nearby:{}, radiusOnly:false,
    loading:false, lastRoute:null
  };

  var el = {
    pills:document.getElementById("pillsRow"),
    grid:document.getElementById("productGrid"),
    results:document.getElementById("resultsSection"),
    search:document.getElementById("searchInput"),
    historySection:document.getElementById("historySection"),

    nearbySection:document.getElementById("nearbySection"),

    geoBtn:document.getElementById("geoBtn"),

    radiusCheck:document.getElementById("radiusCheck"),

    demoHint:document.getElementById("demoHint"),
    routeSection:document.getElementById("routeSection")
  };

  var historyIds = [];
  var LOADING_MS = 700;
  var loadTimer = null;

  /* ---------- i18n ---------- */

    document.getElementById("langEn").setAttribute("aria-pressed", lang === "en" ? "true" : "false");

    document.getElementById("footerDisclaimer").textContent = t("footerDisclaimer");
    document.getElementById("footerCompliance").textContent = t("footerCompliance");
    document.getElementById("footerPrivacy").textContent = t("footerPrivacy");

  function renderAll(){
    applyStaticStrings();
    renderPills();
    renderDemoHeader();
    renderGrid();
    renderResults();
    renderGeoMessage();
    renderNearby();
    renderBasketBar();
    renderUpdatedLine();
    if (state.lastRoute) showRoute(state.lastRoute.store, state.lastRoute.branch, true);
  }

  function setLang(next){
    if (next === lang) return;
    lang = next;
    renderAll();
    try{ if (window.storage) window.storage.set("lang", lang, false); } catch(e){}
  }

  /* ---------- Dernière mise à jour ---------- */

  var UPDATED_AT = new Date();
  function renderUpdatedLine(){
    var fmt = new Intl.DateTimeFormat(lang === "fr" ? "fr-CA" : "en-CA", {
      hour:"2-digit", minute:"2-digit"
    });
    document.getElementById("updatedLine").textContent = t("updatedLabel", { when:fmt.format(UPDATED_AT) });
  }

  /* ---------- Grille de produits ---------- */

  function renderPills(){
    el.pills.innerHTML = "";
    CATEGORIES.forEach(function(cat){
      var btn = document.createElement("button");
      btn.className = "pill" + (state.category === cat.key ? " active" : "");
      btn.textContent = loc(cat);
      btn.addEventListener("click", function(){
        state.category = cat.key;
        renderPills();
        renderDemoHeader();
        renderGrid();
      });
      el.pills.appendChild(btn);
    });
  }

  function currentQueryActive(){ return foldAccents(state.query).length > 0; }

  function matchesFilter(p){
    var q = foldAccents(state.query);
    var inCat = state.category === "all" || p.cat === state.category;
    if (!inCat) return false;
    if (q){
      var hay = foldAccents(p.name.fr + " " + p.name.en + " " + p.brand.fr + " " + p.brand.en);
      return hay.indexOf(q) !== -1;
    }
    if (state.category === "all") return !!p.popular;
    return true;
  }

  function visibleProducts(){ return PRODUCTS.filter(matchesFilter); }

  function renderDemoHeader(){
    var list = visibleProducts();
    var showingDefault = !currentQueryActive() && state.category === "all";
    el.demoTitle.textContent = showingDefault ? t("demoTitlePopular") : t("demoTitleAll", { n:list.length });
    el.demoHint.textContent = showingDefault ? t("demoHintDefault") : t("demoHintFiltered", { n:list.length });
  }

  function cheapestDisplayPrice(p){
    var best = null;
    STORES.forEach(function(s){
      var o = storeOffer(p, s);
      if (o.available && (best == null || o.effective < best)) best = o.effective;
    });
    return best;
  }

  function renderGrid(){
    var list = visibleProducts();
    el.grid.innerHTML = "";
    if (list.length === 0){
      var empty = document.createElement("p");
      empty.className = "empty-msg";
      empty.textContent = t("noMatch");
      el.grid.appendChild(empty);
      return;
    }
    list.forEach(function(p){
      var card = document.createElement("button");
      var picked = inBasket(p.id);
      card.className = "card" + (picked ? " picked" : "");
      card.setAttribute("aria-pressed", picked ? "true" : "false");
      card.setAttribute("data-pid", p.id);
      var priceFrom = cheapestDisplayPrice(p);
      card.innerHTML =
        '<span class="tick" aria-hidden="true">\u2713</span>' +
        '<div class="cat-tag">' + catLabel(p.cat) + '</div>' +
        '<div class="pname">' + loc(p.name) + '</div>' +
        '<div class="pbrand">' + loc(p.brand) + '</div>' +
        (priceFrom != null ? '<div class="pprice">' + t("bestPrice") + ": " + money(priceFrom) + '</div>' : '');
      card.addEventListener("click", function(){ toggleProduct(p.id, false); });
      el.grid.appendChild(card);
    });

  function markCard(id){
    var card = el.grid.querySelector('[data-pid="' + id + '"]');
    if (!card) return;
    var picked = inBasket(id);
    card.classList.toggle("picked", picked);
    card.setAttribute("aria-pressed", picked ? "true" : "false");
  }
  function markAllCards(){
    el.grid.querySelectorAll("[data-pid]").forEach(function(card){
      var picked = inBasket(Number(card.getAttribute("data-pid")));
      card.classList.toggle("picked", picked);
      card.setAttribute("aria-pressed", picked ? "true" : "false");
    });
  }

  /* ---------- Résultats : produit unique ---------- */

  function eligibleStores(){
    if (!(state.radiusOnly && state.pos)) return STORES.slice();
    return STORES.filter(function(s){
      var b = state.nearby[s];
      return !!b && b.km <= RADIUS_KM;
    });
  }

  function storeRowHtml(store, offer, rank, isBest, outOfRange){
    var branch = state.nearby[store];
    var dist = "";
    if (state.pos){
      dist = (branch && branch.km <= REGION_LIMIT_KM)
        ? formatKm(branch.km) + " · " + loc(branch.place)
        : t("notInRegion");
    }
    var cls = "store-row";
    if (isBest) cls += " best";
    if (outOfRange) cls += " out-of-range";
    if (!offer.available) cls += " unavailable";

    var priceBlock;
    if (!offer.available){
      priceBlock = '<span class="store-price">' + t("notSold") + '</span>';
    } else {
      priceBlock =
        (offer.onPromo ? '<span class="price-was">' + money(offer.regular) + '</span>' : '') +
        '<span class="store-price">' + money(offer.shelf) + '</span>' +
        (offer.onPromo ? '<span class="promo-tag">PROMO</span>' : '');
    }

    var memberNote = (store === "Costco" && offer.available) ? '<span class="member-note">(' + t("memberRequired") + ')</span>' : "";

    return '<div class="' + cls + '">' +
      (isBest ? '<span class="best-badge">' + t("bestPrice") + '</span>' : '') +
      '<span class="store-rank">' + rank + '</span>' +
      '<span class="store-main">' +
        '<span class="store-name">' + store + memberNote + '</span>' +
        (dist ? '<span class="store-dist">' + dist + '</span>' : '') +
        (offer.available && offer.unit ? '<span class="store-unit">' + offer.unit + '</span>' : '') +
      '</span>' +
      '<span class="price-block">' + priceBlock + '</span>' +
    '</div>';
  }

  function renderSingleProduct(p){
    var filtering = state.radiusOnly && state.pos;
    function reachable(store){
      if (!filtering) return true;
      var b = state.nearby[store];
      return !!b && b.km <= RADIUS_KM;
    }

    var offers = {};
    STORES.forEach(function(s){ offers[s] = storeOffer(p, s); });
    var sold = STORES.filter(function(s){ return offers[s].available; });
    var ranked = sold.filter(reachable).sort(function(a,b){ return offers[a].effective - offers[b].effective; });
    var tooFar = sold.filter(function(s){ return !reachable(s); })
                     .sort(function(a,b){ return offers[a].effective - offers[b].effective; });
    var notSold = STORES.filter(function(s){ return !offers[s].available; });

    state.lastRanked = ranked;
    state.lastOffers = offers;

    var rows = ranked.map(function(s, i){ return storeRowHtml(s, offers[s], i+1, i===0, false); }).join("");
    if (ranked.length === 0){
      rows += '<div class="range-note">' + t("noneInRadius", { km:RADIUS_KM }) + '</div>';
    }
    if (tooFar.length){
      rows += '<div class="out-header">' + t("beyondRadius", { km:RADIUS_KM }) + '</div>';
      rows += tooFar.map(function(s){ return storeRowHtml(s, offers[s], "–", false, true); }).join("");
    }
    rows += notSold.map(function(s){ return storeRowHtml(s, { available:false }, "—", false, false); }).join("");

    var couponBanner = p.coupon
      ? '<div class="coupon-banner"><span class="tag-icon" aria-hidden="true">\u{1F39F}\ufe0f</span><p>' +
        t("couponAvailable", { amount:money(p.coupon) }) + '</p></div>'
      : "";

    var savings = "";
    if (ranked.length >= 2){
      var lo = ranked[0], hi = ranked[ranked.length - 1];
      var diff = offers[hi].effective - offers[lo].effective;
      savings = diff > 0.001
        ? '<div class="savings"><span class="savings-amount">' + money(diff) + '</span>' +
          '<span class="savings-label">' + t("savingsLabel") + '</span>' +
          '<p class="savings-vs">' + t("savingsVs", { price:money(offers[hi].effective), store:hi, n:ranked.length }) + '</p></div>'
        : '<div class="savings flat"><span class="savings-label">' + t("savingsFlat") + '</span></div>';
    } else if (ranked.length === 1){
      savings = '<div class="savings flat"><span class="savings-label">' + t("savingsAlone") + '</span></div>';
    }

    var meta = catLabel(p.cat) + " · " + loc(p.brand);
    if (filtering) meta += " · " + t("withinRadius", { km:RADIUS_KM });

    var canRoute = ranked.length > 0 && !!state.pos;
    var actions = '<div class="card-actions">' +
      (ranked.length ? '<button class="share-btn" id="shareBtn" type="button"><span aria-hidden="true">\u2197</span>' + t("shareBtn") + '</button>' : '') +
      (canRoute ? '<button class="route-btn" id="routeBtn" type="button">' + t("routeBtn") + '</button>' : '') +
    '</div>';

    el.results.innerHTML =
      '<div class="results-card">' +
        '<div class="results-meta">' + meta + '</div>' +
        '<div class="results-title">' + loc(p.name) + '</div>' +
        couponBanner + savings + rows +
        (ranked.length ? actions + '<div class="share-fallback" id="shareFallback"></div>' : '') +
      '</div>';

    var shareBtn = document.getElementById("shareBtn");
    if (shareBtn) shareBtn.addEventListener("click", shareResult);
    var routeBtn = document.getElementById("routeBtn");
    if (routeBtn) routeBtn.addEventListener("click", function(){
      var winner = ranked[0];
      var branch = state.nearby[winner];
      if (branch) showRoute(winner, branch);
    });
  }

  /* ---------- Résultats : panier (plusieurs produits, un seul magasin choisi) ---------- */

  function inBasket(id){ return state.basket.indexOf(id) !== -1; }

  function basketAnalysis(){
    var items = state.basket.map(function(id){ return productById[id]; }).filter(Boolean);
    var stores = eligibleStores();

    var rows = stores.map(function(s){
      var have = [];
      var total = 0;
      items.forEach(function(p){
        var o = storeOffer(p, s);
        if (o.available){ have.push({ product:p, offer:o }); total += o.effective; }
      });
      return { store:s, have:have.length, total:total, lines:have, complete:have.length === items.length && items.length > 0 };
    });

    var complete = rows.filter(function(r){ return r.complete; }).sort(function(a,b){ return a.total - b.total; });
    var partial = rows.filter(function(r){ return !r.complete; }).sort(function(a,b){ return (b.have - a.have) || (a.total - b.total); });
    return { items:items, complete:complete, partial:partial };
  }

  function renderBasketCard(){
    var a = basketAnalysis();
    var filtering = state.radiusOnly && state.pos;

    var meta = (state.basket.length === 1 ? t("basketOne") : t("basketMany", { n:state.basket.length }));
    if (filtering) meta += " · " + t("withinRadius", { km:RADIUS_KM });

    var html = '<div class="results-meta">' + meta + '</div>' +
               '<div class="results-title">' + t("basketTitle") + '</div>';

    if (a.complete.length >= 2){
      var lo = a.complete[0], hi = a.complete[a.complete.length - 1];
      var diff = hi.total - lo.total;
      html += diff > 0.001
        ? '<div class="savings"><span class="savings-amount">' + money(diff) + '</span>' +
          '<span class="savings-label">' + t("savingsLabel") + '</span>' +
          '<p class="savings-vs">' + t("basketSavingsVs", { price:money(hi.total), store:hi.store, n:a.complete.length }) + '</p></div>'
        : '<div class="savings flat"><span class="savings-label">' + t("savingsFlat") + '</span></div>';
    } else if (a.complete.length === 1){
      html += '<div class="savings flat"><span class="savings-label">' + t("basketOneStoreOnly") + '</span></div>';
    } else {
      html += '<div class="savings flat"><span class="savings-label">' + t("basketNoneComplete") + '</span></div>';
    }

    function rowHtml(r, isBest){
      var cov = r.complete ? t("basketCoverageFull") : t("basketCoveragePartial", { have:r.have, total:a.items.length });
      var dist = "";
      if (state.pos){
        var b = state.nearby[r.store];
        dist = (b && b.km <= REGION_LIMIT_KM) ? " · " + formatKm(b.km) : "";
      }
      return '<div class="basket-row' + (isBest ? ' best' : '') + (r.complete ? '' : ' partial') + '">' +
        (isBest ? '<span class="best-badge">' + t("bestPrice") + '</span>' : '') +
        '<span class="basket-store"><span class="n">' + r.store + '</span>' +
          '<span class="cov">' + cov + dist + '</span></span>' +
        '<span class="basket-total">' + money(r.total) + '</span>' +
      '</div>';
    }
    a.complete.forEach(function(r, i){ html += rowHtml(r, i === 0); });
    a.partial.forEach(function(r){ html += rowHtml(r, false); });

    var winner = a.complete[0];
    if (winner){
      html += '<div class="items-head">' + t("basketItemsHead", { store:winner.store }) + '</div>';
      winner.lines.forEach(function(line){
        html += '<div class="item-line">' +
          '<span class="item-name">' + loc(line.product.name) + '</span>' +
          '<span class="item-price">' + money(line.offer.effective) + '</span>' +
        '</div>';
      });
    }

    var canRoute = !!winner && !!state.pos;
    html += '<div class="card-actions">' +
      '<button class="share-btn" id="shareBtn" type="button"><span aria-hidden="true">\u2197</span>' + t("shareBtn") + '</button>' +
      (canRoute ? '<button class="route-btn" id="routeBtn" type="button">' + t("routeBtn") + '</button>' : '') +
    '</div><div class="share-fallback" id="shareFallback"></div>';

    el.results.innerHTML = '<div class="results-card">' + html + '</div>';
    document.getElementById("shareBtn").addEventListener("click", shareResult);
    var routeBtn = document.getElementById("routeBtn");
    if (routeBtn) routeBtn.addEventListener("click", function(){
      var branch = state.nearby[winner.store];
      if (branch) showRoute(winner.store, branch);
    });
  }

  function renderLoading(){
    el.results.innerHTML =
      '<div class="results-card" aria-busy="true">' +
        '<div class="loading-head"><span class="loading-dot"></span>' + t("loadingTitle") + '</div>' +
        '<div class="skel w45"></div><div class="skel w80"></div>' +
        '<div class="skel w60"></div><div class="skel w70"></div><div class="skel w45"></div>' +
      '</div>';
  }

  function renderResults(){
    if (state.loading){ renderLoading(); return; }
    if (state.basket.length === 0){
      el.results.innerHTML = '<div class="results-placeholder">' + t("noProduct") + '</div>';
      return;
    }
    if (state.basket.length > 1){ renderBasketCard(); return; }
    var p = productById[state.basket[0]];
    if (!p){ el.results.innerHTML = ""; return; }
    renderSingleProduct(p);
  }

  /* ---------- Partage ---------- */

  function buildShareText(){
    if (state.basket.length > 1){
      var a = basketAnalysis();
      var w = a.complete[0];
      if (!w) return "";
      return t("shareTextSimple", { product:t("basketTitle"), price:money(w.total), store:w.store });
    }
    var p = productById[state.basket[0]];
    if (!p || !state.lastRanked || !state.lastRanked.length) return "";
    var lo = state.lastRanked[0];
    var offers = state.lastOffers;
    if (state.lastRanked.length >= 2){
      var hi = state.lastRanked[state.lastRanked.length - 1];
      return t("shareText", {
        product:loc(p.name), price:money(offers[lo].effective), store:lo,
        savings:money(offers[hi].effective - offers[lo].effective), vsStore:hi
      });
    }
    return t("shareTextSimple", { product:loc(p.name), price:money(offers[lo].effective), store:lo });
  }

  function showShareFallback(text){
    var host = document.getElementById("shareFallback");
    if (!host) return;
    host.innerHTML = '<p class="savings-vs" style="color:var(--ink-soft); margin:0 0 6px;">' + t("shareFallbackLabel") + '</p><textarea readonly></textarea>';
    var ta = host.querySelector("textarea");
    ta.value = text; ta.focus(); ta.select();
  }
  function flashCopied(){
    var btn = document.getElementById("shareBtn");
    if (!btn) return;
    var original = btn.innerHTML;
    btn.innerHTML = "\u2713 " + t("shareCopied");
    setTimeout(function(){ if (btn.isConnected) btn.innerHTML = original; }, 1800);
  }
  async function shareResult(){
    var text = buildShareText();
    if (!text) return;
    try{
      if (navigator.share){ await navigator.share({ text:text }); return; }
    } catch(e){ if (e && e.name === "AbortError") return; }
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
        flashCopied();
        return;
      }
    } catch(e){}
    showShareFallback(text);
  }

  /* ---------- Sélection ---------- */

  function toggleProduct(id, focus){
    var first = state.basket.length === 0;
    if (inBasket(id)) state.basket = state.basket.filter(function(x){ return x !== id; });
    else state.basket = state.basket.concat([id]);

    if (state.basket.length) pushHistory(id);
    markCard(id);
    renderBasketBar();

    if (first && state.basket.length){
      state.loading = true;
      renderResults();
      clearTimeout(loadTimer);
      loadTimer = setTimeout(function(){ state.loading = false; renderResults(); }, LOADING_MS);
    } else {
      state.loading = false;
      clearTimeout(loadTimer);
      renderResults();
    }
    if (focus) scrollToResults();
  }

  function clearBasket(){
    state.basket = [];
    state.loading = false;
    state.lastRoute = null;
    clearTimeout(loadTimer);
    markAllCards();
    renderBasketBar();
    renderResults();
    hideRoute();
  }

  function scrollToResults(){ el.results.scrollIntoView({ behavior:"smooth", block:"start" }); }

  function renderBasketBar(){
    var bar = document.getElementById("basketBar");
    var n = state.basket.length;
    if (n === 0){ bar.classList.remove("open"); document.body.classList.remove("has-basket"); return; }
    document.body.classList.add("has-basket");
    bar.classList.add("open");
    document.getElementById("basketCount").textContent = n === 1 ? t("basketOne") : t("basketMany", { n:n });

    var bestEl = document.getElementById("basketBest");
    if (n === 1){
      var p = productById[state.basket[0]];
      var best = null;
      STORES.forEach(function(s){ var o = storeOffer(p, s); if (o.available && (!best || o.effective < best.effective)) best = { store:s, effective:o.effective }; });
      bestEl.innerHTML = best ? t("basketBest", { store:best.store, total:money(best.effective) }) : t("basketNoneComplete");
    } else {
      var a = basketAnalysis();
      bestEl.innerHTML = a.complete.length ? t("basketBest", { store:a.complete[0].store, total:money(a.complete[0].total) }) : t("basketNoneComplete");
    }
    document.getElementById("basketView").textContent = t("basketView");
    document.getElementById("basketClear").textContent = t("basketClear");
  }

  /* ---------- Géolocalisation ---------- */

  function computeNearby(){
    state.nearby = {};
    if (!state.pos) return;
    STORES.forEach(function(banner){
      var best = null;
      LOCATIONS.forEach(function(l){
        if (l.banner !== banner) return;
        var km = haversineKm(state.pos.lat, state.pos.lng, l.lat, l.lng);
        if (!best || km < best.km) best = { place:l.place, km:km, lat:l.lat, lng:l.lng };
      });
      state.nearby[banner] = best;
    });
  }

  function renderGeoMessage(){
    if (!state.pos){ el.geoMsg.textContent = t("geoIntro"); return; }
    var label = state.posCityIndex != null ? loc(CITIES[state.posCityIndex].name) : t("myPosition");
    var closest = null;
    STORES.forEach(function(b){
      var n = state.nearby[b];
      if (n && (!closest || n.km < closest.km)) closest = { banner:b, place:n.place, km:n.km };
    });
    el.geoMsg.innerHTML = closest
      ? t("geoClosest", { label:label, banner:closest.banner, km:formatKm(closest.km), place:loc(closest.place) })
      : t("geoNothing", { label:label });
  }

  function renderNearby(){
    if (!state.pos){ el.nearbySection.style.display = "none"; return; }
    var here = [], away = [];
    STORES.forEach(function(b){
      var n = state.nearby[b];
      if (n && n.km <= REGION_LIMIT_KM) here.push({ banner:b, place:n.place, km:n.km });
      else away.push(b);
    });
    here.sort(function(a,b){ return a.km - b.km; });
    el.nearbyList.innerHTML =
      here.map(function(r){
        return '<div class="nearby-row"><span class="nearby-banner">' + r.banner + '</span>' +
          '<span class="nearby-place">' + loc(r.place) + '</span>' +
          '<span class="nearby-km">' + formatKm(r.km) + '</span></div>';
      }).join("") +
      away.map(function(b){
        return '<div class="nearby-row absent"><span class="nearby-banner">' + b + '</span>' +
          '<span class="nearby-place"></span><span class="nearby-km">' + t("notInRegion") + '</span></div>';
      }).join("");
    el.nearbySection.style.display = "block";
  }

  function setPosition(lat, lng, cityIndex){
    state.pos = { lat:lat, lng:lng };
    state.posCityIndex = (cityIndex === undefined) ? null : cityIndex;
    computeNearby();
    el.cityPicker.style.display = "none";
    el.radiusToggle.style.display = "flex";
    el.geoBtn.textContent = t("geoBtnAgain");
    renderGeoMessage();
    renderNearby();
    renderResults();
    renderBasketBar();
  }

  function showCityFallback(reasonKey){
    el.geoMsg.textContent = t(reasonKey) + " " + t("geoPickCity");
    el.cityPicker.innerHTML = "";
    CITIES.forEach(function(c, i){
      var btn = document.createElement("button");
      btn.className = "city-btn";
      btn.textContent = loc(c.name);
      btn.addEventListener("click", function(){ setPosition(c.lat, c.lng, i); });
      el.cityPicker.appendChild(btn);
    });
    el.cityPicker.style.display = "flex";
  }

  function requestPosition(){
    if (!navigator.geolocation){ showCityFallback("geoNoApi"); return; }
    el.geoMsg.textContent = t("geoSearching");
    navigator.geolocation.getCurrentPosition(
      function(p){ setPosition(p.coords.latitude, p.coords.longitude); },
      function(err){ showCityFallback(err && err.code === 1 ? "geoDenied" : "geoUnavailable"); },
      { enableHighAccuracy:false, timeout:10000, maximumAge:300000 }
    );
  }

  /* ---------- Itinéraire (carte + lien externe) ---------- */

  var routeMap = null, routeLayers = [];

  function showRoute(store, branch, silent){
    state.lastRoute = { store:store, branch:branch };
    el.routeSection.style.display = "block";
    document.getElementById("routeStoreName").textContent = store + " — " + loc(branch.place);
    document.getElementById("routeDistance").textContent = formatKm(branch.km != null ? branch.km : haversineKm(state.pos.lat, state.pos.lng, branch.lat, branch.lng));

    var mapsUrl = "https://www.google.com/maps/dir/?api=1&origin=" + state.pos.lat + "," + state.pos.lng +
                  "&destination=" + branch.lat + "," + branch.lng + "&travelmode=driving";
    document.getElementById("openMapsLink").href = mapsUrl;

    setTimeout(function(){
      if (typeof L === "undefined") return;
      if (!routeMap){
        routeMap = L.map("routeMapCanvas");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom:19, attribution:"&copy; OpenStreetMap contributors"
        }).addTo(routeMap);
      }
      routeLayers.forEach(function(ly){ routeMap.removeLayer(ly); });
      routeLayers = [];
      var a = [state.pos.lat, state.pos.lng], b = [branch.lat, branch.lng];
      var m1 = L.marker(a).addTo(routeMap).bindPopup(t("myPosition"));
      var m2 = L.marker(b).addTo(routeMap).bindPopup(store);
      var line = L.polyline([a, b], { color:"#C1432B", weight:3, dashArray:"6,8" }).addTo(routeMap);
      routeLayers.push(m1, m2, line);
      routeMap.fitBounds(line.getBounds(), { padding:[28,28] });
      routeMap.invalidateSize();
    }, 60);

    if (!silent) el.routeSection.scrollIntoView({ behavior:"smooth", block:"start" });
  }

  function hideRoute(){
    state.lastRoute = null;
    el.routeSection.style.display = "none";
  }

  /* ---------- Historique ---------- */

  async function loadStored(){
    if (!window.storage) return;
    try{
      var l = await window.storage.get("lang", false);
      if (l && l.value && I18N[l.value]) lang = l.value;
    } catch(e){}
    try{
      var h = await window.storage.get("history", false);
      if (h && h.value) historyIds = JSON.parse(h.value);
    } catch(e){}
  }
  async function pushHistory(id){
    historyIds = [id].concat(historyIds.filter(function(x){ return x !== id; })).slice(0, 8);
    renderHistory();
    try{ if (window.storage) await window.storage.set("history", JSON.stringify(historyIds), false); } catch(e){}
  }
  function renderHistory(){
    var valid = historyIds.map(function(id){ return productById[id]; }).filter(Boolean);
    if (valid.length === 0){ el.historySection.style.display = "none"; return; }
    el.historySection.style.display = "block";
    el.historyChips.innerHTML = "";
    valid.forEach(function(p){
      var chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = loc(p.name);
      chip.addEventListener("click", function(){ toggleProduct(p.id, true); });
      el.historyChips.appendChild(chip);
    });
  }

  /* ---------- Câblage ---------- */

  var clearBtn = document.getElementById("clearSearch");
  function syncClearBtn(){ clearBtn.classList.toggle("show", el.search.value.length > 0); }
  el.search.addEventListener("input", function(){
    state.query = el.search.value;
    syncClearBtn();
    renderDemoHeader();
    renderGrid();
  });
  clearBtn.addEventListener("click", function(){
    el.search.value = ""; state.query = "";
    syncClearBtn(); renderDemoHeader(); renderGrid(); el.search.focus();
  });
  document.getElementById("searchForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    renderDemoHeader();
    renderGrid();
    document.getElementById("productGrid").scrollIntoView({ behavior:"smooth", block:"start" });
  });

  el.geoBtn.addEventListener("click", requestPosition);
  el.radiusCheck.addEventListener("change", function(){
    state.radiusOnly = this.checked;
    renderResults();
    renderBasketBar();
  });
  document.getElementById("basketView").addEventListener("click", scrollToResults);
  document.getElementById("basketClear").addEventListener("click", clearBasket);
  document.getElementById("routeClose").addEventListener("click", hideRoute);
  document.querySelectorAll(".lang-toggle button").forEach(function(btn){
    btn.addEventListener("click", function(){ setLang(btn.getAttribute("data-lang")); });
  });

  if ((navigator.language || "").toLowerCase().indexOf("en") === 0) lang = "en";
  renderAll();
  loadStored().then(renderAll);

})();
</script>
</body>
</html>
